<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy Tasks</title>

  <!-- Google Fonts: Outfit for headings, Source Sans 3 for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="site-header">
    <div class="brand">
      <svg class="logo-icon" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="#0F766E"></rect>
        <path d="M10 18.5l5.5 5.5L26 12.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="brand-name">StudyBuddy</span>
    </div>
    <!-- The date is filled in by JavaScript -->
    <span id="today-date" class="today-date"></span>
  </header>

  <main class="page">

    <!-- ===== WELCOME HEADING ===== -->
    <div class="intro">
      <h1>Let's get things done.</h1>
      <p>Add what is due, then tick it off when it is finished.</p>
    </div>

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="summary" aria-label="Task summary">
      <div class="summary-card">
        <span class="summary-icon summary-icon-total" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
        </span>
        <div>
          <span id="total-count" class="summary-number">0</span>
          <span class="summary-label">Total tasks</span>
        </div>
      </div>

      <div class="summary-card">
        <span class="summary-icon summary-icon-pending" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </span>
        <div>
          <span id="pending-count" class="summary-number">0</span>
          <span class="summary-label">Pending</span>
        </div>
      </div>

      <div class="summary-card summary-card-done">
        <span class="summary-icon summary-icon-done" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </span>
        <div>
          <span id="completed-count" class="summary-number">0</span>
          <span class="summary-label">Completed</span>
        </div>
      </div>
    </section>

    <div class="layout">

      <!-- ===== ADD A TASK ===== -->
      <section class="card add-card">
        <h2>Add a task</h2>

        <!-- "novalidate" lets our own JavaScript show the error message -->
        <form id="task-form" class="task-form" novalidate>
          <div class="field">
            <label for="task-title">Task title</label>
            <input id="task-title" class="input" type="text" maxlength="80" placeholder="e.g. Finish chemistry homework" autocomplete="off">
            <p id="title-hint" class="hint">Keep it short and clear.</p>
            <p id="title-error" class="error-message" hidden>Please enter a task title.</p>
          </div>

          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" class="input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <button class="btn btn-primary" type="submit">Add Task</button>
        </form>
      </section>

      <!-- ===== TASK LIST ===== -->
      <section class="card list-card">
        <div class="toolbar">
          <div class="search-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <input id="search-input" class="input search-input" type="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
          </div>

          <!-- Filter buttons. data-filter tells JavaScript which tasks to show -->
          <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-button is-active" data-filter="all">All <span id="filter-all-count">0</span></button>
            <button type="button" class="filter-button" data-filter="pending">Pending <span id="filter-pending-count">0</span></button>
            <button type="button" class="filter-button" data-filter="completed">Completed <span id="filter-completed-count">0</span></button>
          </div>
        </div>

        <!-- The task rows are added here by JavaScript -->
        <ul id="task-list" class="task-list"></ul>

        <!-- Shown when there is nothing to display -->
        <div id="empty-state" class="empty-state" hidden>
          <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
            <rect x="14" y="10" width="44" height="54" rx="8" fill="#D9F2EE"></rect>
            <rect x="26" y="5" width="20" height="12" rx="5" fill="#0F766E"></rect>
            <rect x="23" y="30" width="26" height="5" rx="2.5" fill="#FFFFFF"></rect>
            <rect x="23" y="41" width="18" height="5" rx="2.5" fill="#FFFFFF"></rect>
          </svg>
          <h3 id="empty-title">No tasks yet</h3>
          <p id="empty-text">Add your first task and it will show up here.</p>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
